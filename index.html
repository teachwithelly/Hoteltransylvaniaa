<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel Transylvania — The Secret Human Mission</title><style>
:root{font-family:Trebuchet MS,Arial,sans-serif;color:#fff4e9;background:#100c22}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}#app{min-height:100vh;background:linear-gradient(#09071bbb,#09071b99),url('assets/room1.png') center/cover fixed}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 3%;background:#110b26d9;border-bottom:1px solid #eab66b55;gap:12px}.brand{color:#e9b970;font-weight:900;letter-spacing:1px}.progress{font-size:13px;color:#e6d4ee}.bar{height:5px;background:#44324f;border-radius:20px;overflow:hidden;margin-top:5px}.bar b{display:block;background:#f0b96a;height:100%;transition:.3s}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.btn{border:1px solid #dfb77a77;background:#2d2049;color:#fff5e9;padding:10px 14px;border-radius:12px}.nav button.active,.btn.primary{background:linear-gradient(120deg,#a04478,#693c9d);border-color:#e7ad74}.btn:hover,.nav button:hover{filter:brightness(1.2)}main{max-width:1150px;margin:auto;padding:24px 18px 90px}.hero{text-align:center;padding:45px 15px 20px;text-shadow:0 3px 18px #000}.hero h1{font-size:clamp(32px,5vw,62px);margin:0;color:#ffda91}.hero p{font-size:19px}.panel{background:#140e2de8;border:1px solid #dfaf7e66;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 12px 35px #05020c80;backdrop-filter:blur(8px)}h2{color:#ffd69b;margin:0 0 12px}h3{color:#eac5fb;margin:8px 0 12px}.muted{color:#d5c8dd}.scene{display:flex;align-items:end;gap:18px;min-height:245px}.char{height:245px;max-width:205px;object-fit:contain;filter:drop-shadow(0 5px 8px #000)}.bubble{background:#fff4e9;color:#241637;padding:15px 19px;border-radius:18px 18px 18px 3px;font-weight:bold;max-width:680px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}.tile{border:1px solid #e8b77755;background:#352447dd;border-radius:15px;padding:14px;min-height:90px}.tile img{display:block;object-fit:contain;height:100px;max-width:100%;margin:0 auto 8px}.tile.click{cursor:pointer}.tile.click:hover{outline:2px solid #ffc77a}.pill{display:inline-block;border:1px solid #ba9bd0;background:#2e224c;padding:6px 10px;border-radius:30px;margin:4px;font-size:13px}.choice{display:block;width:100%;text-align:left;margin:7px 0;padding:12px 15px;border-radius:12px;border:1px solid #a990ba;background:#2d2249;color:white}.choice.selected{border-color:#ffd48b;background:#593b65}.choice.correct{border-color:#70d6a6;background:#235e52}.choice.wrong{border-color:#f78d9a;background:#733447}.feedback{margin:12px 0;padding:12px;border-radius:10px;background:#42305e}.ok{color:#a3ffd3}.bad{color:#ffc0c5}.word{font-size:20px;font-weight:bold;color:#ffda9d}.ipa{color:#d6b6ef;font-size:14px}.small{font-size:14px}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.inputs{display:flex;flex-wrap:wrap;gap:8px}.inputs input{padding:10px;background:#fff9ef;border:0;border-radius:9px;min-width:170px;color:#1b1330}.statement{border-left:3px solid #e4b16e;padding:10px 15px;margin:8px 0;background:#352744}.scene-link{font-weight:bold;color:#ffe1a7}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:16px}.tiny{font-size:12px;color:#cabbd2}.hidden{display:none}.center{text-align:center}.spark{font-size:50px}.tag{color:#ffe5a5;font-size:12px;text-transform:uppercase;letter-spacing:2px}.objectbar{display:flex;gap:10px;flex-wrap:wrap}.objectbar button{flex:1;min-width:100px;background:#322448;border:1px solid #d2a96a;border-radius:14px;padding:9px;color:#fff}.objectbar img{height:72px;width:100%;object-fit:contain}.objectbar button:hover{background:#5b3c6b}@media(max-width:600px){.top{display:block}.nav{margin-top:10px}.panel{padding:15px}.char{height:170px;max-width:135px}.hero{padding:25px 5px 8px}.scene{min-height:170px}.bubble{font-size:14px}}

.sort-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;padding:12px;border:1px solid #e8b77755;border-radius:12px;background:#352447dd}.sort-row strong{min-width:180px;color:#ffe1a7}.sort-row button{padding:9px 12px;border-radius:10px;border:1px solid #bfa0c9;background:#392850;color:white}.sort-row button.correct{background:#235e52;border-color:#70d6a6}.sort-row button.wrong{background:#733447;border-color:#f78d9a}.gapline{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;margin:8px 0;border-radius:12px;background:#352447dd}.gapline label{flex:1;min-width:240px}.gapline input{width:145px;padding:10px;border-radius:9px;border:2px solid #9e83b1;background:#fff9ef;color:#241637}.gapline input.good{border-color:#2a9d70}.gapline input.nope{border-color:#d36d7d}.gapline .feedback{margin:0}.exercise-actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}@media(max-width:600px){.sort-row strong{min-width:100%}.gapline input{width:130px}}
</style></head><body><div id="app"><header class="top"><div><div class="brand">🦇 TeachwithElly · MONSTER MISSIONS</div><div class="progress" id="progress"></div><div class="bar"><b id="fill"></b></div></div><nav class="nav" id="nav"></nav></header><main id="main"></main></div><script>
const A='assets/';const pics={dracula:['image-lasso.png','image-lasso (1).png','image-lasso (2).png','image-lasso (3).png'],johnny:[4,5,6,7].map(x=>`image-lasso (${x}).png`),mavis:[8,9,10,11].map(x=>`image-lasso (${x}).png`),book:12,letter:13,key:14,scroll:15,potion:16,candle:17,mirror:18,chest:19};const asset=n=>A+(typeof n==='number'?`image-lasso (${n}).png`:n);const sprite=(who,i)=>`<img class="char" src="${asset(pics[who][i])}" alt="${who}">`;const obj=(n)=>`<img src="${asset(pics[n])}" alt="${n}">`;const vocab=[['be terrified of','/bi ˈterɪfaɪd əv/','to be extremely frightened of someone or something'],['overprotective','/ˌəʊvəprəˈtektɪv/','trying too hard to protect someone'],['sneak into','/sniːk ˈɪntuː/','to enter secretly'],['disguise yourself as','/dɪsˈɡaɪz jɔːˈself æz/','to change your appearance to look like someone or something else'],['keep a secret','/kiːp ə ˈsiːkrət/','to hide information from others'],['freak out','/friːk aʊt/','to suddenly become very scared, shocked or upset'],['fit in','/fɪt ɪn/','to feel accepted as part of a group'],['get into trouble','/ɡet ˈɪntuː ˈtrʌbəl/','to end up in a difficult situation'],['break the rules','/breɪk ðə ruːlz/','to do something that is not allowed'],['take a risk','/teɪk ə rɪsk/','to do something that might be dangerous']];const rooms=['Castle Gate','Hotel Lobby','Secret Library','Time Machine','Grand Finale'];let room=0,step=0,score=0,seen=new Set(),chosen={},reveal=new Set();const tasks=[['Warm-up','First impressions'],['Lead-in','Meet Dracula'],['Vocabulary','Discover the words'],['Vocabulary','Monster challenges'],['Video Mission','Watch & investigate'],['Grammar','Dracula: Then & Now'],['Grand Finale','Speak & celebrate']];const total=tasks.length;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('ellyMonster',JSON.stringify({step,score,seen:[...seen]}))}catch(e){}}function load(){try{let d=JSON.parse(localStorage.getItem('ellyMonster'));if(d){step=d.step||0;score=d.score||0;seen=new Set(d.seen||[])}}catch(e){}}load();function go(s){step=Math.max(0,Math.min(total-1,s));room=[0,1,2,2,1,3,4][step];save();render();window.scrollTo(0,0)}function answer(id,options,correct,why){const pick=chosen[id];return `<div>${options.map((o,i)=>`<button class="choice ${pick===i?(i===correct?'correct':'wrong'):' ' }" onclick="pick('${id}',${i},${correct})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>${pick!==undefined?`<div class="feedback ${pick===correct?'ok':'bad'}">${pick===correct?'✓ Brilliant!':'↻ Try again.'} ${why||''}</div>`:''}`};function pick(id,i,c){if(chosen[id]===c)return;chosen[id]=i;if(i===c&&!seen.has(id)){score++;seen.add(id);save()}render(false)}function revealItem(id){reveal.add(id);render(false)}function panel(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}function scene(who,i,text){return `<div class="scene">${sprite(who,i)}<div class="bubble">${text}</div></div>`}function footer(){return `<div class="footer"><button class="btn" onclick="go(${step-1})" ${step===0?'disabled':''}>← Back</button><button class="btn primary" onclick="go(${step===total-1?0:step+1})">${step===total-1?'Play again ↻':'Next mission →'}</button></div>`}function itembar(items){return `<div class="objectbar">${items.map(([key,lab])=>`<button onclick="revealItem('${key}')">${obj(key)}<span>${lab}</span></button>`).join('')}</div>`}function vocabcard(i){let [w,ipa,def]=vocab[i];return `<div class="tile click" onclick="revealItem('w${i}')"><div class="word">${w}</div><div class="ipa">${ipa}</div><p class="small">${reveal.has('w'+i)?def:'🔒 Tap to reveal the meaning'}</p></div>`}function quiz(q,id,opts,c,why){return `<div class="tile"><strong>${q}</strong>${answer(id,opts,c,why)}</div>`}
const spelling=[
['Dracula really fr_____ out when something goes wrong.','freaks'],
['Johnny sn_____ into the hotel without permission.','sneaks'],
['Mavis thinks her dad is ov____________.','overprotective'],
['Dracula wants to ke__ a se____ about Johnny.','keep a secret'],
['Johnny tries to f__ in with the monsters.','fit'],
['Mavis wants to ta__ a r___ and explore the world.','take a risk'],
['Johnny might g__ into tr_____ if the monsters find out.','get into trouble'],
['The hotel guests are te________ of humans.','terrified'],
['Johnny has to di______ himself as a monster.','disguise'],
['Johnny might br___ the ru___ without realising it.','break the rules']];
const sorting=[['be overprotective','Dracula'],['sneak into the hotel','Johnny'],['want to explore the human world','Mavis'],['freak out when things go wrong','Dracula'],['disguise himself as a monster','Johnny'],['take a risk to gain independence','Mavis'],['keep Johnny’s identity a secret','Dracula'],['try to fit in with monsters','Johnny'],['feel annoyed by strict rules','Mavis']];
let spellAnswers={},sortAnswers={};
function checkSpell(){document.querySelectorAll('[data-spell]').forEach(el=>{spellAnswers[+el.dataset.spell]=el.value.trim()});render(false)}
function sortPick(i,person){sortAnswers[i]=person;if(person===sorting[i][1]&&!seen.has('sort'+i)){seen.add('sort'+i);score++;save()}render(false)}
function spellingTask(){return `<p class="muted">Restore the missing letters. Type the complete missing word or expression, then check your answers.</p>${spelling.map(([q,a],i)=>{let v=spellAnswers[i]||'',correct=v.toLowerCase().replace(/\s+/g,' ').trim()===a;return `<div class="gapline"><label for="spell${i}">${i+1}. ${q}</label><input id="spell${i}" data-spell="${i}" autocomplete="off" value="${v.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}" placeholder="Your answer" class="${v?(correct?'good':'nope'):''}">${v?`<span class="${correct?'ok':'bad'}">${correct?'✓ Correct':'↻ Try again'}</span>`:''}</div>`}).join('')}<div class="exercise-actions"><button class="btn primary" onclick="checkSpell()">Check my spelling ✓</button></div><p class="tiny">Tip: use the correct verb form in each sentence. For “fr_____ out”, Dracula <em>freaks out</em>.</p>`}
function sortingTask(){return `<p class="muted">Who is most closely connected with each action or situation? Choose a character, then explain your choice aloud.</p>${sorting.map(([phrase,correct],i)=>`<div class="sort-row"><strong>${phrase}</strong>${['Dracula','Johnny','Mavis'].map(name=>`<button class="${sortAnswers[i]===name?(name===correct?'correct':'wrong'):''}" onclick="sortPick(${i},'${name}')">${name==='Dracula'?'🧛':name==='Johnny'?'🎒':'🖤'} ${name}</button>`).join('')}${sortAnswers[i]?`<span class="${sortAnswers[i]===correct?'ok':'bad'}">${sortAnswers[i]===correct?'✓':'↻'}</span>`:''}</div>`).join('')}<p class="scene-link">Speaking bonus: Choose three expressions and explain: “I chose Johnny because he sneaks into the hotel.”</p>`}
function render(scroll=true){$('app').style.backgroundImage=`linear-gradient(#09071baa,#09071baa),url('${A}room${room+1}.png')`;$('progress').textContent=`Mission ${step+1} of ${total} · ${tasks[step][0]} · ⭐ ${score} correct`;$('fill').style.width=((step+1)/total*100)+'%';$('nav').innerHTML=rooms.map((n,i)=>`<button class="${i===room?'active':''}" onclick="go(${[0,1,2,5,6][i]})">${n}</button>`).join('');let html='';
if(step===0){html=`<div class="hero"><div class="tag">An interactive English adventure · A2+ / B1</div><h1>THE SECRET HUMAN MISSION</h1><p>Welcome to Hotel Transylvania. Someone has broken the most important rule…</p></div>${panel('Warm-up · First Impressions Can Be Wrong!',scene('dracula',0,'Before you enter, tell me: can appearances be misleading?')+`<p class="muted">Look at these situations. What do you think is happening? What makes you think so?</p><div class="grid"><div class="tile">🏰 <strong>A mysterious castle</strong><p>Would you enter? Who might live there?</p></div><div class="tile">👤 <strong>A scary-looking stranger</strong><p>Could this person actually be friendly?</p></div><div class="tile">🚪 <strong>An unexpected guest</strong><p>What would you do if someone appeared at your door?</p></div></div><p class="scene-link">Speaking challenge: Describe a time when your first impression was wrong.</p>`)}${footer()}`}
if(step===1){html=`<div class="hero"><h1>WELCOME TO THE HOTEL</h1><p>Rule number one: NO HUMANS ALLOWED!</p></div>${panel('Lead-in · Who is the mysterious guest?',scene('dracula',2,'Humans are dangerous! I must protect Mavis. No exceptions!')+scene('johnny',0,'Wow! What an amazing hotel! Why is everyone staring at me?')+`<div class="grid"><div class="tile">💬 Why does Dracula want to keep humans away?</div><div class="tile">💬 How might Mavis feel about her father's rules?</div><div class="tile">💬 What problems could Johnny cause?</div></div><p class="muted">Predict: Which character will change their mind by the end of the story?</p>`)}${panel('Choose your prediction',quiz('What is Dracula most likely to do when he meets Johnny?','lead',['Invite him to stay openly','Try to hide the human guest','Leave the hotel immediately'],1,'Think about the hotel rule!'))}${footer()}`}
if(step===2){html=`<div class="hero"><h1>DRACULA’S SECRET LIBRARY</h1><p>Find the magical book. Discover 10 powerful expressions.</p></div>${panel('Explore the library',scene('mavis',0,'Dad keeps everything secret! Click the magical objects to uncover our vocabulary.')+itembar([['book','Spellbook'],['scroll','Magic scroll'],['mirror','Magic mirror']])+`${reveal.has('book')?'<div class="feedback">📖 The spellbook is open! Read the expressions below.</div>':''}${reveal.has('scroll')?'<div class="feedback">📜 Secret challenge: use three expressions to predict the story.</div>':''}${reveal.has('mirror')?'<div class="feedback">🪞 Who might feel left out? Who might freak out? Explain why.</div>':''}`)}${panel('Vocabulary Discovery · Tap to reveal English definitions',`<div class="grid">${vocab.map((_,i)=>vocabcard(i)).join('')}</div><p class="tiny">Pronunciation: British English IPA. Tap each card to see the English definition.</p>`)}${panel('Match the meaning',quiz('Which expression means “to enter secretly”?','v1',['keep a secret','sneak into','take a risk'],1)+quiz('Which expression means “to feel accepted by a group”?','v2',['fit in','freak out','break the rules'],0)+quiz('Which expression describes someone who protects others too much?','v3',['terrified','overprotective','disguised'],1)+quiz('Which expression means “to suddenly panic”?','v4',['freak out','fit in','take a risk'],0))}${footer()}`}
if(step===3){html=`<div class="hero"><h1>MONSTER TROUBLE!</h1><p>Dracula needs your help. Open the secret objects.</p></div>${panel('Dracula’s Emergency Messages',scene('dracula',1,'Emergency! Johnny is here. My hotel is in danger!')+itembar([['letter','Secret letter'],['potion','Potion hint'],['candle','Candle clue'],['chest','Mystery chest']])+`${reveal.has('letter')?'<div class="feedback">✉️ Fill in the missing expression in each emergency message.</div>':''}${reveal.has('potion')?'<div class="feedback">🧪 Hint: A secret is information you do not tell other people.</div>':''}${reveal.has('candle')?'<div class="feedback">🕯️ Speaking: What is the biggest risk Johnny takes?</div>':''}${reveal.has('chest')?'<div class="feedback">🧰 Bonus: Create a new hotel rule and explain who might break it.</div>':''}`)}${panel('Task 4 · Complete the emergency messages',quiz('“Johnny must ______ a monster so the guests don’t recognise him!”','e1',['disguise himself as','fit in','take a risk'],0)+quiz('“Mavis cannot find out. We must ______!”','e2',['get into trouble','keep a secret','freak out'],1)+quiz('“Someone has entered the hotel without permission. They have ______!”','e3',['broken the rules','fitted in','kept a secret'],0)+quiz('“If the monsters discover Johnny, I will ______!”','e4',['fit in','freak out','sneak into'],1))}${panel('NEW · Dracula’s Broken Messages — Complete the words',spellingTask())}${panel('NEW · Who Would Do That? — Sort by character',sortingTask())}${panel('Task 5 · Monster Problems, Monster Solutions',quiz('Johnny wants to become friends with the monsters. What should he try to do?','m1',['fit in','keep them at a distance','freak out'],0)+quiz('Mavis wants to explore the human world, but Dracula says no. What might she need to do?','m2',['take a risk','keep a secret forever','freak out'],0))}${panel('Task 6 · The Monster’s Dilemma',`<p><strong>Role-play:</strong> You are Dracula's adviser. Choose one problem and give him advice using at least three expressions.</p><div class="grid"><div class="tile">🧛 Dracula is terrified of humans. How can he change?</div><div class="tile">🖤 Mavis thinks her father is overprotective. What should she say?</div><div class="tile">🎒 Johnny wants to fit in but keeps getting into trouble. Help him!</div></div>`)}${panel('Task 7 · The Forbidden Guest',`<p>Finish the story aloud using these expressions: <em>sneak into, disguise himself as, keep a secret, break the rules, take a risk.</em></p><p class="statement">One evening, a human traveller decided to ______ a mysterious hotel. Dracula had to ______ a monster to protect the hotel's biggest secret. But Johnny was about to ______, and everything was going to change…</p><p class="muted">How would you finish the story? Give it a surprising ending!</p>`)}${footer()}`}
if(step===4){html=`<div class="hero"><h1>VIDEO MISSION</h1><p>Dracula Meets Johnny · Watch like a detective!</p></div>${panel('Before watching',scene('johnny',1,'I think Dracula is hiding something… Can you work out what happens?')+`<p>Predict: How will Dracula react? Will Johnny fit in? Will anyone keep a secret?</p><iframe class="video" src="https://www.youtube-nocookie.com/embed/J5FZvQ0GUvs" title="Hotel Transylvania video clip" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><p class="small">If the embedded video is blocked, <a class="scene-link" href="https://youtu.be/J5FZvQ0GUvs" target="_blank" rel="noopener">open the clip on YouTube ↗</a>.</p>`)}${panel('While watching · Detective notes',`<p>Watch the clip and decide. Explain your answers using evidence from what you saw.</p><div class="grid"><div class="tile">🔍 Does Dracula seem comfortable around Johnny?</div><div class="tile">🔍 Does Johnny understand the danger of being in the hotel?</div><div class="tile">🔍 What does Dracula do to protect his secret?</div></div><h3>Character thoughts</h3><p>Complete aloud: “Dracula is terrified of ___ because ___.”</p><p>“Johnny might get into trouble if ___.”</p><p>“Dracula wants to keep ___ a secret.”</p>`)}${panel('After watching · Compare and discuss',`<div class="grid"><div class="tile">🧛 Dracula: What does he believe about humans?</div><div class="tile">🎒 Johnny: What does he believe about monsters?</div><div class="tile">💭 Which character jumps to conclusions? Why?</div></div><p class="muted">Use at least four expressions from the spellbook in your answers.</p>`)}${footer()}`}
if(step===5){html=`<div class="hero"><h1>DRACULA’S TIME MACHINE</h1><p>Travel between THEN and NOW to unlock <em>used to</em>!</p></div>${panel('Turn the magical clock',scene('dracula',3,'I used to think all humans were dangerous. But Johnny changed my mind!')+`<div class="center"><button class="btn primary" onclick="revealItem('clock')">🕰️ Turn the clock: THEN ↔ NOW</button></div>${reveal.has('clock')?'<div class="grid"><div class="tile"><h3>⏳ THEN</h3><p>Dracula believed humans were dangerous.</p><p>He kept them away from the hotel.</p></div><div class="tile"><h3>✨ NOW</h3><p>Dracula knows Johnny can be a friend.</p><p>He is more open-minded.</p></div></div>':''}`)}${panel('Discover the grammar',`<div class="statement"><strong>Past habit or state:</strong> Dracula <b>used to believe</b> humans were dangerous.</div><div class="statement"><strong>Negative:</strong> He <b>didn’t use to trust</b> humans.</div><div class="statement"><strong>Question:</strong> <b>Did</b> he <b>use to be</b> terrified of humans?</div><p class="tiny">After did / didn’t, use <b>use to</b> (without -d).</p>`)}${panel('Repair the time machine · Choose the correct form',quiz('Dracula ___ be terrified of humans.','g1',['used to','use to','using to'],0)+quiz('He ___ trust Johnny at first.','g2',['didn’t used to','didn’t use to','doesn’t used to'],1)+quiz('___ Dracula use to keep humans away?','g3',['Did','Does','Was'],0)+quiz('Mavis ___ want to explore the world outside the hotel.','g4',['used to','did use to not','use to'],0))}${panel('Interview Dracula',`<p>Ask Dracula these questions aloud. Then answer as Dracula, using the target grammar.</p><div class="grid"><div class="tile">Did you use to be afraid of humans?</div><div class="tile">What rules did you use to have?</div><div class="tile">Did you use to trust strangers?</div><div class="tile">What didn’t you use to understand about humans?</div></div><h3>Change his old beliefs</h3><p class="statement">THEN: “Humans are always dangerous.” → NOW: “I used to think humans were always dangerous, but now I know…”</p><p class="statement">THEN: “No human can fit in here.” → NOW: “I didn’t use to believe humans could fit in, but…”</p>`)}${footer()}`}
if(step===6){html=`<div class="hero"><h1>THE GRAND MONSTER FINALE!</h1><p>One last challenge. Can you change Dracula’s mind?</p></div>${panel('Monster Dilemmas · Choose and defend',scene('mavis',3,'You made it! Now show us how much you’ve learned!')+`<div class="grid"><div class="tile"><h3>🧛 Dilemma 1</h3><p>A human wants to stay at the hotel, but the monsters are terrified. What should Dracula do?</p></div><div class="tile"><h3>🎒 Dilemma 2</h3><p>Johnny accidentally breaks a hotel rule. Should Dracula give him another chance?</p></div><div class="tile"><h3>🖤 Dilemma 3</h3><p>Mavis wants to travel alone. Her father is overprotective. Who is right?</p></div></div><p class="scene-link">Speaking mission: Choose two dilemmas. Use at least five vocabulary expressions and two sentences with used to.</p>`)}${panel('Final Challenge · How Have You Changed?',`<p>Complete the sentences about your own life. Give details and examples.</p><div class="grid"><div class="tile">I used to be terrified of…</div><div class="tile">I didn’t use to enjoy…</div><div class="tile">I used to think… but now…</div><div class="tile">I didn’t use to… but these days…</div></div><p>Ask your teacher: <strong>Did you use to…?</strong> Then compare your answers.</p>`)}${panel('🎉 Mission Complete!',`<div class="center"><div class="spark">🏆 🦇 ✨</div><h2>You are a Master Monster Detective!</h2><p>You explored the hotel, learned 10 expressions and travelled through Dracula’s past.</p><p>⭐ Correct answers and sorting points: <strong>${score}</strong></p><button class="btn primary" onclick="restart()">Play Again ↻</button></div>`)}${footer()}`}
$('main').innerHTML=html}function restart(){score=0;seen.clear();chosen={};reveal.clear();go(0)}render();
</script></body></html>
